<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CARE Syria Service Map</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

:root{
--orange:#EB7100;
--dark:#241E4E;
--purple:#5C2163;
--lilac:#BF7CB5;
--cream:#FFF8EE;
--light:#F9F6F4;
--danger:#E10917;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#eef2f7;
color:#222;
}

.header{
background:var(--dark);
color:white;
padding:20px 35px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.header h1{
font-size:30px;
font-weight:700;
}

.logo{
color:var(--orange);
font-size:28px;
font-weight:700;
}

.top-menu{
display:flex;
gap:12px;
}

.btn{
background:white;
color:var(--dark);
border:none;
padding:10px 18px;
border-radius:30px;
cursor:pointer;
font-weight:600;
}

.container{
padding:25px;
}

.filters{
background:white;
padding:20px;
border-radius:20px;
display:flex;
gap:10px;
flex-wrap:wrap;
box-shadow:0 2px 12px rgba(0,0,0,.08);
margin-bottom:25px;
}

.filter{
padding:12px 18px;
border:1px solid #ddd;
border-radius:30px;
background:#fafafa;
}

.kpi-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.kpi{
background:white;
border-radius:24px;
padding:25px;
text-align:center;
box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.kpi-value{
font-size:42px;
font-weight:700;
color:var(--dark);
}

.kpi-title{
margin-top:10px;
color:#555;
font-size:15px;
}

.content-grid{
display:grid;
grid-template-columns:1fr 1fr;
